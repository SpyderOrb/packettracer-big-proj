!
version 12.2(37)SE1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname HQ-L3
!
!
no profinet
!
!
!
!
!
ip routing
!
!
!
!
! REDACTED: admin account credential (captured privilege 15); recreate before enabling login local.
!
!
!
!
!
!
!
!
!
!
ip ssh version 2
ip domain-name lab.example
!
!
spanning-tree mode pvst
spanning-tree vlan 10,20,30,40,50,999 priority 24576
!
!
!
!
!
!
interface Port-channel1
 description LACP trunk to HQ-SW1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Port-channel2
 description LACP trunk to HQ-SW2
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface FastEthernet0/2
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface FastEthernet0/3
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode active
!
interface FastEthernet0/4
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode active
!
interface FastEthernet0/5
!
interface FastEthernet0/6
!
interface FastEthernet0/7
!
interface FastEthernet0/8
!
interface FastEthernet0/9
!
interface FastEthernet0/10

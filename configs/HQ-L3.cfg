interface FastEthernet0/11
!
interface FastEthernet0/12
!
interface FastEthernet0/13
!
interface FastEthernet0/14
!
interface FastEthernet0/15
!
interface FastEthernet0/16
!
interface FastEthernet0/17
!
interface FastEthernet0/18
!
interface FastEthernet0/19
!
interface FastEthernet0/20
!
interface FastEthernet0/21
!
interface FastEthernet0/22
!
interface FastEthernet0/23
!
interface FastEthernet0/24
!
interface GigabitEthernet0/1
 description To HQ-R1 G0/0
 no switchport
 ip address 10.255.1.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description MGMT gateway
 mac-address 00e0.b0ad.6301
 ip address 10.10.10.1 255.255.255.240
!
interface Vlan20
 description IT gateway
 mac-address 00e0.b0ad.6302
 ip address 10.10.20.1 255.255.255.240
!
interface Vlan30
 description USERS gateway
 mac-address 00e0.b0ad.6303
 ip address 10.10.30.1 255.255.255.192
 ip helper-address 10.10.40.10
!
interface Vlan40
 description SERVERS gateway
 mac-address 00e0.b0ad.6304
 ip address 10.10.40.1 255.255.255.240
!
interface Vlan50
 description GUEST gateway
 mac-address 00e0.b0ad.6305
 ip address 10.10.50.1 255.255.255.224
 ip helper-address 10.10.40.10
!
router ospf 1
 router-id 10.255.255.4
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.255.1.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.15 area 0
 network 10.10.20.0 0.0.0.15 area 0
 network 10.10.30.0 0.0.0.63 area 0
 network 10.10.40.0 0.0.0.15 area 0
 network 10.10.50.0 0.0.0.31 area 0
!
ip classless
!
ip flow-export version 9
!
!
access-list 10 permit 10.10.20.0 0.0.0.15
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
line vty 5 15
 access-class 10 in
 login local
 transport input ssh
!
!
!
!
end

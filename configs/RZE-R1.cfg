!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname RZE-R1
!
!
!
! REDACTED: enable secret; recreate through the console.
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
! REDACTED: admin account credential (captured privilege 15); recreate before enabling login local.
!
!
license udi pid CISCO2911/K9 sn FTX1524VMBR-
!
!
!
!
!
!
!
!
!
!
!
ip ssh version 2
ip domain-name lab.example
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.30.10.1 255.255.255.240
 ip access-group MGMT_RZE_IN in
!
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.224
 ip helper-address 10.10.40.10
 ip access-group USERS_RZE_IN in
!
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 10.30.50.1 255.255.255.240
 ip helper-address 10.10.40.10
 ip access-group GUEST_RZE_IN in
!
interface GigabitEthernet0/0.999
 encapsulation dot1Q 999 native
 no ip address
!
interface GigabitEthernet0/1
 ip address 10.255.0.3 255.255.255.248
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.3
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.255.0.0 0.0.0.7 area 0
 network 10.30.30.0 0.0.0.31 area 0
 network 10.30.50.0 0.0.0.15 area 0
 network 10.30.10.0 0.0.0.15 area 0
!
ip classless
!
ip flow-export version 9
!
!
access-list 10 permit 10.10.20.0 0.0.0.15
ip access-list extended GUEST_RZE_IN
 permit udp any eq bootpc host 255.255.255.255 eq bootps
 permit udp 10.30.50.0 0.0.0.15 eq bootpc host 10.10.40.10 eq bootps
 permit icmp 10.30.50.0 0.0.0.15 host 10.30.50.1 echo
 permit udp 10.30.50.0 0.0.0.15 host 203.0.113.10 eq domain
 permit tcp 10.30.50.0 0.0.0.15 host 203.0.113.10 eq domain
 permit tcp 10.30.50.0 0.0.0.15 host 203.0.113.10 eq www
 permit icmp 10.30.50.0 0.0.0.15 host 203.0.113.10 echo
 deny ip any any
ip access-list extended USERS_RZE_IN
 permit udp any eq bootpc host 255.255.255.255 eq bootps
 permit udp 10.30.30.0 0.0.0.31 eq bootpc host 10.10.40.10 eq bootps
 permit icmp 10.30.30.0 0.0.0.31 host 10.30.30.1 echo
 permit udp 10.30.30.0 0.0.0.31 host 10.10.40.10 eq domain
 permit tcp 10.30.30.0 0.0.0.31 host 10.10.40.10 eq domain
 permit tcp 10.30.30.0 0.0.0.31 host 10.10.40.10 eq www
 permit tcp 10.30.30.0 0.0.0.31 host 203.0.113.10 eq www
 permit icmp 10.30.30.0 0.0.0.31 host 203.0.113.10 echo
 permit icmp 10.30.30.0 0.0.0.31 10.10.20.0 0.0.0.15 echo-reply
 deny ip any any
ip access-list extended MGMT_RZE_IN
 permit tcp 10.30.10.0 0.0.0.15 eq 22 10.10.20.0 0.0.0.15 established
 permit icmp 10.30.10.0 0.0.0.15 10.10.20.0 0.0.0.15 echo-reply
 permit icmp 10.30.10.0 0.0.0.15 host 10.30.10.1 echo
 deny ip any any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
line vty 5 15
 access-class 10 in
 login local
 transport input ssh
!
!
!
end

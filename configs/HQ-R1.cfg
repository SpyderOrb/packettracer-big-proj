!
ip ssh version 2
ip domain-name lab.example
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 description To HQ-L3 G0/1
 ip address 10.255.1.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 10.255.0.1 255.255.255.248
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description To ISP-R1 G0/0
 ip address 198.51.100.2 255.255.255.252
 ip nat outside
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.255.1
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.255.1.0 0.0.0.3 area 0
 network 10.255.0.0 0.0.0.7 area 0
 default-information originate
!
ip nat inside source list 20 interface GigabitEthernet0/2 overload
ip classless
ip route 0.0.0.0 0.0.0.0 198.51.100.1
!
ip flow-export version 9
!
!
access-list 10 permit 10.10.20.0 0.0.0.15
access-list 20 permit 10.30.50.0 0.0.0.15
access-list 20 permit 10.10.20.0 0.0.0.15
access-list 20 permit 10.10.30.0 0.0.0.63
access-list 20 permit 10.10.50.0 0.0.0.31
access-list 20 permit 10.20.30.0 0.0.0.31
access-list 20 permit 10.20.50.0 0.0.0.15
access-list 20 permit 10.30.30.0 0.0.0.31
!

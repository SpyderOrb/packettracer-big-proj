<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">HQ and branches: planned Packet Tracer topology</title>
  <desc id="desc">Three site routers share Ethernet transit for OSPF area zero. Headquarters provides the only simulated Internet exit and has two switches joined by EtherChannel. Each branch has one switch. This is a design diagram, not evidence of a built or validated network.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #182b42; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 17px; fill: #52657b; }
      .site { font-size: 21px; font-weight: 700; }
      .name { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #52657b; }
      .card { fill: #fff; stroke: #c9d5e1; stroke-width: 2; }
      .router { fill: #e3efff; stroke: #3d70ae; stroke-width: 2; }
      .switch { fill: #e3f3ee; stroke: #408774; stroke-width: 2; }
      .wan { fill: none; stroke: #4675b2; stroke-width: 3; }
      .lan { fill: none; stroke: #408774; stroke-width: 3; }
      .edge { fill: none; stroke: #b17a36; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1440" height="960" fill="#f4f7fb"/>
  <text x="44" y="51" class="title">HQ + Branches NOC Lab</text>
  <text x="44" y="83" class="sub">Planned topology · Not yet built or validated · Packet Tracer 9.0.1 target</text>

  <rect x="40" y="420" width="440" height="455" rx="18" class="card"/>
  <rect x="520" y="420" width="440" height="455" rx="18" class="card"/>
  <rect x="1000" y="420" width="400" height="455" rx="18" class="card"/>
  <text x="65" y="455" class="site">Kraków · HQ</text>
  <text x="545" y="455" class="site">Katowice</text>
  <text x="1025" y="455" class="site">Rzeszów</text>

  <path d="M220 210 V485" class="edge"/>
  <text x="57" y="266" class="small">HQ–ISP edge</text>
  <text x="57" y="291" class="tiny">198.51.100.0/30</text>
  <text x="57" y="315" class="tiny">HQ PAT / sole exit</text>
  <path d="M320 170 H400" class="edge"/>
  <rect x="120" y="130" width="200" height="80" rx="12" class="router"/>
  <text x="220" y="164" text-anchor="middle" class="name">ISP-R1</text>
  <text x="220" y="191" text-anchor="middle" class="tiny">No corporate OSPF</text>
  <rect x="400" y="130" width="265" height="80" rx="12" class="card"/>
  <text x="532" y="160" text-anchor="middle" class="name">EXT-SRV1 · DNS / HTTP</text>
  <text x="532" y="188" text-anchor="middle" class="tiny">203.0.113.10/24 · ISP gateway .1</text>
  <text x="120" y="113" class="tiny">SIMULATED INTERNET</text>

  <rect x="760" y="200" width="220" height="80" rx="12" class="switch"/>
  <text x="870" y="234" text-anchor="middle" class="name">WAN-SW</text>
  <text x="870" y="260" text-anchor="middle" class="tiny">Access VLAN 900 · No IP</text>
  <path d="M870 280 V350 M330 350 H1200 M330 350 V485 M740 350 V485 M1200 350 V485" class="wan"/>
  <circle cx="870" cy="350" r="5" fill="#4675b2"/>
  <circle cx="740" cy="350" r="5" fill="#4675b2"/>
  <text x="415" y="315" class="small">Shared Ethernet transit · 10.255.0.0/29 · OSPF area 0</text>
  <text x="344" y="385" class="tiny">HQ .1</text>
  <text x="754" y="385" class="tiny">KAT .2</text>
  <text x="1214" y="385" class="tiny">RZE .3</text>
  <text x="1010" y="239" class="tiny">Lab transit only</text>
  <text x="1010" y="263" class="tiny">No VPN or WAN redundancy</text>

  <rect x="170" y="485" width="175" height="58" rx="10" class="router"/>
  <text x="257" y="521" text-anchor="middle" class="name">HQ-R1</text>
  <rect x="652" y="485" width="176" height="58" rx="10" class="router"/>
  <text x="740" y="521" text-anchor="middle" class="name">KAT-R1</text>
  <rect x="1112" y="485" width="176" height="58" rx="10" class="router"/>
  <text x="1200" y="521" text-anchor="middle" class="name">RZE-R1</text>

  <path d="M257 543 V570 H160 V599" class="lan"/>
  <path d="M740 543 V599 M1200 543 V599" class="lan"/>
  <text x="275" y="569" class="tiny">802.1Q trunk</text>
  <text x="756" y="574" class="tiny">802.1Q trunk</text>
  <text x="1216" y="574" class="tiny">802.1Q trunk</text>
  <rect x="80" y="599" width="160" height="58" rx="10" class="switch"/>
  <text x="160" y="635" text-anchor="middle" class="name">HQ-SW1</text>
  <rect x="295" y="599" width="160" height="58" rx="10" class="switch"/>
  <text x="375" y="635" text-anchor="middle" class="name">HQ-SW2</text>
  <path d="M240 616 H295 M240 640 H295" class="lan"/>
  <text x="267" y="682" text-anchor="middle" class="tiny">Po1 · 2 × F0/23–24 · LACP</text>
  <rect x="652" y="599" width="176" height="58" rx="10" class="switch"/>
  <text x="740" y="635" text-anchor="middle" class="name">KAT-SW1</text>
  <rect x="1112" y="599" width="176" height="58" rx="10" class="switch"/>
  <text x="1200" y="635" text-anchor="middle" class="name">RZE-SW1</text>

  <text x="70" y="726" class="small">VLANs 10 / 20 / 30 / 40 / 50</text>
  <text x="70" y="753" class="tiny">Management · IT · Users · Servers · Guest</text>
  <text x="70" y="785" class="small">HQ-SRV1 · DHCP / DNS / HTTP</text>
  <text x="70" y="812" class="tiny">HQ-PC1 / HQ-PC2 / IT-PC1 / HQ-GUEST1</text>
  <text x="70" y="848" class="tiny">Site allocation: 10.10.0.0/16</text>

  <text x="550" y="726" class="small">VLANs 10 / 30 / 50</text>
  <text x="550" y="753" class="tiny">Management · Users · Guest</text>
  <text x="550" y="797" class="small">KAT-PC1 / KAT-GUEST1</text>
  <text x="550" y="848" class="tiny">Site allocation: 10.20.0.0/16</text>

  <text x="1030" y="726" class="small">VLANs 10 / 30 / 50</text>
  <text x="1030" y="753" class="tiny">Management · Users · Guest</text>
  <text x="1030" y="797" class="small">RZE-PC1 / RZE-GUEST1</text>
  <text x="1030" y="848" class="tiny">Site allocation: 10.30.0.0/16</text>

  <text x="44" y="918" class="sub">All VLAN gateways are on site routers. See NETWORK.md for exact masks, ports, pools, and access policy.</text>
</svg>

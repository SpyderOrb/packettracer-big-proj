<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">HQ and branches: planned Packet Tracer topology</title>
  <desc id="desc">Three site routers share Ethernet transit for OSPF area zero. Headquarters has a 3560 collapsed core with VLAN gateways, two separate LACP access bundles, and a routed link to its Internet edge router. Each branch has one switch. This is a design diagram, not evidence of a built or validated network.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #182b42; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { font-size: 17px; fill: #52657b; }
      .site { font-size: 21px; font-weight: 700; }
      .name { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #52657b; }
      .card { fill: #fff; stroke: #c9d5e1; stroke-width: 2; }
      .router { fill: #e3efff; stroke: #3d70ae; stroke-width: 2; }
      .switch { fill: #e3f3ee; stroke: #408774; stroke-width: 2; }
      .wan { fill: none; stroke: #4675b2; stroke-width: 3; }
      .lan { fill: none; stroke: #408774; stroke-width: 3; }
      .edge { fill: none; stroke: #b17a36; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#f4f7fb"/>
  <text x="44" y="51" class="title">HQ + Branches NOC Lab</text>
  <text x="44" y="83" class="sub">HQ Layer 3 design · 20 devices / 21 physical links · Runtime validation pending</text>

  <rect x="40" y="420" width="440" height="610" rx="18" class="card"/>
  <rect x="520" y="420" width="440" height="610" rx="18" class="card"/>
  <rect x="1000" y="420" width="400" height="610" rx="18" class="card"/>
  <text x="65" y="455" class="site">Kraków · HQ</text>
  <text x="545" y="455" class="site">Katowice</text>
  <text x="1025" y="455" class="site">Rzeszów</text>

  <path d="M220 210 V485" class="edge"/>
  <text x="57" y="266" class="small">HQ–ISP edge</text>
  <text x="57" y="291" class="tiny">198.51.100.0/30</text>
  <text x="57" y="315" class="tiny">HQ PAT / sole exit</text>
  <path d="M320 170 H400" class="edge"/>
  <rect x="120" y="130" width="200" height="80" rx="12" class="router"/>
  <text x="220" y="164" text-anchor="middle" class="name">ISP-R1</text>
  <text x="220" y="191" text-anchor="middle" class="tiny">No corporate OSPF</text>
  <rect x="400" y="130" width="265" height="80" rx="12" class="card"/>
  <text x="532" y="160" text-anchor="middle" class="name">EXT-SRV1 · DNS / HTTP</text>
  <text x="532" y="188" text-anchor="middle" class="tiny">203.0.113.10/24 · ISP gateway .1</text>
  <text x="120" y="113" class="tiny">SIMULATED INTERNET</text>

  <rect x="760" y="200" width="220" height="80" rx="12" class="switch"/>
  <text x="870" y="234" text-anchor="middle" class="name">WAN-SW</text>
  <text x="870" y="260" text-anchor="middle" class="tiny">Access VLAN 900 · No IP</text>
  <path d="M870 280 V350 M330 350 H1200 M330 350 V485 M740 350 V485 M1200 350 V485" class="wan"/>
  <circle cx="870" cy="350" r="5" fill="#4675b2"/>
  <circle cx="740" cy="350" r="5" fill="#4675b2"/>
  <text x="415" y="315" class="small">Shared Ethernet transit · 10.255.0.0/29 · OSPF area 0</text>
  <text x="344" y="385" class="tiny">HQ .1</text>
  <text x="754" y="385" class="tiny">KAT .2</text>
  <text x="1214" y="385" class="tiny">RZE .3</text>
  <text x="1010" y="239" class="tiny">Lab transit only</text>
  <text x="1010" y="263" class="tiny">No VPN or WAN redundancy</text>

  <rect x="170" y="485" width="175" height="58" rx="10" class="router"/>
  <text x="257" y="521" text-anchor="middle" class="name">HQ-R1</text>
  <rect x="652" y="485" width="176" height="58" rx="10" class="router"/>
  <text x="740" y="521" text-anchor="middle" class="name">KAT-R1</text>
  <rect x="1112" y="485" width="176" height="58" rx="10" class="router"/>
  <text x="1200" y="521" text-anchor="middle" class="name">RZE-R1</text>

  <path d="M257 543 V620" class="wan"/>
  <text x="275" y="573" class="tiny">Routed link · OSPF</text>
  <text x="275" y="594" class="tiny">10.255.1.0/30</text>
  <rect x="155" y="620" width="210" height="65" rx="10" class="switch"/>
  <text x="260" y="648" text-anchor="middle" class="name">HQ-L3 · 3560</text>
  <text x="260" y="671" text-anchor="middle" class="tiny">SVI gateways · STP root</text>

  <path d="M195 685 V709 H148 V780 M207 685 V721 H160 V780" class="lan"/>
  <path d="M305 685 V709 H375 V780 M317 685 V721 H387 V780" class="lan"/>
  <text x="70" y="746" class="tiny">Po1 · LACP</text>
  <text x="70" y="765" class="tiny">2 × FE</text>
  <text x="280" y="746" class="tiny">Po2 · LACP</text>
  <text x="280" y="765" class="tiny">2 × FE</text>
  <rect x="80" y="780" width="160" height="58" rx="10" class="switch"/>
  <text x="160" y="816" text-anchor="middle" class="name">HQ-SW1</text>
  <rect x="295" y="780" width="160" height="58" rx="10" class="switch"/>
  <text x="375" y="816" text-anchor="middle" class="name">HQ-SW2</text>

  <path d="M740 543 V780 M1200 543 V780" class="lan"/>
  <text x="756" y="619" class="tiny">802.1Q trunk</text>
  <text x="756" y="642" class="tiny">Router VLAN gateways</text>
  <text x="1216" y="619" class="tiny">802.1Q trunk</text>
  <text x="1040" y="682" class="tiny">Router VLAN gateways</text>
  <rect x="652" y="780" width="176" height="58" rx="10" class="switch"/>
  <text x="740" y="816" text-anchor="middle" class="name">KAT-SW1</text>
  <rect x="1112" y="780" width="176" height="58" rx="10" class="switch"/>
  <text x="1200" y="816" text-anchor="middle" class="name">RZE-SW1</text>

  <text x="70" y="877" class="small">VLANs 10 / 20 / 30 / 40 / 50</text>
  <text x="70" y="904" class="tiny">Management · IT · Users · Servers · Guest</text>
  <text x="70" y="942" class="small">HQ-SRV1 · DHCP / DNS / HTTP</text>
  <text x="70" y="969" class="tiny">HQ-PC1 / HQ-PC2 / IT-PC1 / HQ-GUEST1</text>
  <text x="70" y="1005" class="tiny">Site allocation: 10.10.0.0/16</text>

  <text x="550" y="877" class="small">VLANs 10 / 30 / 50</text>
  <text x="550" y="904" class="tiny">Management · Users · Guest</text>
  <text x="550" y="954" class="small">KAT-PC1 / KAT-GUEST1</text>
  <text x="550" y="1005" class="tiny">Site allocation: 10.20.0.0/16</text>

  <text x="1030" y="877" class="small">VLANs 10 / 30 / 50</text>
  <text x="1030" y="904" class="tiny">Management · Users · Guest</text>
  <text x="1030" y="954" class="small">RZE-PC1 / RZE-GUEST1</text>
  <text x="1030" y="1005" class="tiny">Site allocation: 10.30.0.0/16</text>

  <text x="44" y="1072" class="sub">HQ: collapsed core + Layer 2 access. Branches: router-on-a-stick. HQ-L3 is a single point of failure.</text>
  <text x="44" y="1098" class="tiny">Endpoint groups are summarized. NETWORK.md lists every physical cable, subnet, gateway and service.</text>
</svg>
